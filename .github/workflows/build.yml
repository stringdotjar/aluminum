name: Build

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    name: Compiler (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

  runtime:
    name: Runtime (C, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S aluminum-runtime -B aluminum-runtime/build -DCMAKE_C_COMPILER=clang -DALUMINUM_SANITIZE=ON

      - name: Build
        run: cmake --build aluminum-runtime/build

      - name: Test
        run: ctest --test-dir aluminum-runtime/build --output-on-failure

  runtime-lint:
    name: Runtime lint (clang-format, clang-tidy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aluminum-runtime
    steps:
      - uses: actions/checkout@v4

      # Pinned so formatting and analysis results do not change when the runner image updates.
      - name: Install clang tools
        run: pip install clang-format==23.1.5 clang-tidy==23.1.4

      - name: Check formatting
        run: clang-format --dry-run --Werror include/aluminum/*.h src/*.c tests/*.c

      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_COMPILER=clang

      - name: Static analysis
        run: clang-tidy -p build src/*.c tests/*.c
